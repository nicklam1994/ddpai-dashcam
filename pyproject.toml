[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpai-dashcam"
version = "0.1.0"
description = "DDPAI 行車紀錄器本機 Wi-Fi 工具組（Python API + CLI + Web 儀表板）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nicklam1994" }]
keywords = ["ddpai", "dashcam", "mini3s", "wifi", "rtsp"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.4", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
ddpai = "ddpai_dashcam.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddpai_dashcam = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
